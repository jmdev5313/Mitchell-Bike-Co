<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Demo · Mitchell Bike Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/shop.css">
<script type="module" src="/static/js/stage.js"></script>
</head>
<body class="stage-page">
<header class="stage-top">
  <a class="brand" href="/"><span class="wordmark">Mitchell Bike Co.</span><span class="sub">Demo</span></a>
  <ol class="stage-steps" id="steps" aria-label="The story"></ol>
  <div class="stage-actions">
    <button type="button" class="btn btn-outline" id="restart">Start over</button>
  </div>
</header>
<main class="stage-body" id="stage">
  <section class="stage-side side-workshop" id="side-mechanic" aria-label="The workshop, as the Mechanic">
    <iframe id="frame-mechanic" title="The workshop, as the Mechanic sees it"></iframe>
  </section>
  <div class="pov-scrim" id="pov-scrim" hidden></div>
</main>
<footer class="stage-bottom">
  <div class="stage-guide" id="guide" role="status" aria-live="polite"></div>
  <section class="pov" id="pov" aria-label="Customer POV">
    <button type="button" class="pov-tab" id="pov-tab" aria-expanded="false" aria-controls="pov-sheet">
      <span class="pov-title">Customer POV</span>
      <span class="pov-sub" id="pov-sub">Emma's phone</span>
      <span class="badge pov-badge" id="pov-badge" hidden>New</span>
      <span class="pov-caret" aria-hidden="true">▲</span>
    </button>
    <div class="pov-sheet" id="pov-sheet" hidden>
      <div class="phone" id="phone"><div class="phone-screen" id="phone-screen"></div></div>
    </div>
  </section>
</footer>
<noscript><p class="page">The demo stage needs JavaScript.</p></noscript>
</body>
</html>
