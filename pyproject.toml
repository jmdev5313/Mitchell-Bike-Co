[project]
name = "mitchell-bike-co"
version = "0.1.0"
description = "A fictional bike shop where an AI Agent works alongside the Mechanic, over MCP. Portfolio project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.163.1",
    "mcp>=2.3.0",
    "pyyaml",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
